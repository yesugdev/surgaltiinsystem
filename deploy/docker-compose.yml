# YeSuvd Learning Platform — production (learn.yesuvd.tech)
# Ажиллуулах: cd deploy && docker compose up -d --build

name: surgalt

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      TZ: Asia/Ulaanbaatar
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    # Порт гадагш нээхгүй — зөвхөн дотоод сүлжээнд апп холбогдоно
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: surgalt-app:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      # `docker compose up -d --build app` шүүгчийг ч хамт build хийж асаана
      judge:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/surgaltiin_system?authSource=admin
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JUDGE_URL: http://judge:8000
      JUDGE_TOKEN: ${JUDGE_TOKEN:-}
    networks:
      - default
      - judge
    logging: *logging

  # Өрсөлдөөнт Coding: сурагчийн кодыг ажиллуулах хамгаалагдсан шүүгч
  # Интернетгүй (internal сүлжээ), файлын систем зөвхөн уншигдана, эрх хасагдсан.
  judge:
    build:
      context: ../judge
    image: surgalt-judge:latest
    restart: unless-stopped
    environment:
      JUDGE_TOKEN: ${JUDGE_TOKEN:-}
      JUDGE_SLOTS: ${JUDGE_SLOTS:-2}
    networks:
      - judge
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=512m,mode=1777
    cap_drop: [ALL]
    # setpriv (кодыг тусдаа хэрэглэгчээр), үлдсэн процессыг устгах, түр файл цэвэрлэхэд л хэрэгтэй
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: ${JUDGE_CPUS:-2}
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-learn.yesuvd.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

networks:
  # Шүүгчийн сүлжээ: гадагш (интернет) гарах боломжгүй
  judge:
    internal: true

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
