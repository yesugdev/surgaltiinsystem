# YeSuvd Learning Platform — production (learn.yesuvd.tech)
# Ажиллуулах: cd deploy && docker compose up -d --build

name: surgalt

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      TZ: Asia/Ulaanbaatar
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    # Порт гадагш нээхгүй — зөвхөн дотоод сүлжээнд апп холбогдоно
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: surgalt-app:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/surgaltiin_system?authSource=admin
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-learn.yesuvd.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
